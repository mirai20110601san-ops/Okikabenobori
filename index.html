<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>妖精の崖登り</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4efe6;--fg:#222;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--fg:#eee}}
:root[data-theme="dark"]{--bg:#1c1b1a;--fg:#eee}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:calc(100% - 90px);max-height:640px;aspect-ratio:9/16;max-width:100%}
canvas{width:100%;height:100%;border:3px solid var(--fg);border-radius:6px;background:#000;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
#ui{display:flex;gap:10px;margin-top:10px}
#ui button{width:92px;height:60px;padding:0;border-radius:16px;border:3px solid #7a4a22;background:#ffd1e8;box-shadow:0 5px 0 #7a4a22;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#ui button#bu{background:#d7f5c4;width:110px}
#ui svg{width:100%;height:100%;pointer-events:none;display:block}
#title{position:absolute;inset:3px;border-radius:4px;background:linear-gradient(#4f9cf0,#cfe8ff 72%,#7bd163 72.1%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;z-index:5;color:#5a3a1a}
#title h1{margin:0;font-size:clamp(34px,11vw,52px);letter-spacing:.08em;color:#fff;text-shadow:3px 3px 0 #7a4a22,-2px -2px 0 #7a4a22,2px -2px 0 #7a4a22,-2px 2px 0 #7a4a22;font-weight:900}
#title img{height:36%;image-rendering:pixelated}
#title p{margin:0;font-size:14px;line-height:1.6;font-weight:bold;color:#2b3a55}
#start{font-size:26px;font-weight:900;padding:12px 40px;border-radius:20px;border:4px solid #7a4a22;background:#ffd1e8;color:#7a4a22;box-shadow:0 6px 0 #7a4a22;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#start:active{transform:translateY(5px);box-shadow:0 1px 0 #7a4a22}
#ui button:active{transform:translateY(4px);box-shadow:0 1px 0 #7a4a22}
</style></head><body>
